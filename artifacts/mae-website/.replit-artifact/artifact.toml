kind = "web"
previewPath = "/"
title = "Maharshi Advanced English"
version = "1.0.0"
id = "artifacts/mae-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24057

[services.development]
run = "pnpm --filter @workspace/mae-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mae-website", "run", "build" ]
publicDir = "artifacts/mae-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24057"
BASE_PATH = "/"
